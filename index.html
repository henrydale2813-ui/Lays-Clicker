    const password=document.getElementById("password").value.trim();
    const users=getUsers();
    if(!users[username]||users[username].password!==password)return alert("Invalid login!");
    user=username;
    stats={...users[username]};
    loadGame();
}

function loadGame(){
    document.getElementById("auth-section").style.display="none";
    document.getElementById("game").style.display="block";
    document.getElementById("greeting").textContent=`Hello, ${user}!`;
    renderUpgradeShop();
    generateShop();
    updateUI();
    setInterval(()=>{stats.money+=stats.hands;updateUI();save();},1000);
}

function createFloatingMoney(value){
    const span=document.createElement("span");
    span.className="floating-money";
    span.textContent=`+${value}`;
    const rect=document.getElementById("lays-img").getBoundingClientRect();
    span.style.left=(rect.left+rect.width/2-container.getBoundingClientRect().left)+"px";
    span.style.top=(rect.top-container.getBoundingClientRect().top)+"px";
    container.appendChild(span);
    setTimeout(()=>span.remove(),1000);
}

window.clickLays=function(){
    stats.money+=stats.mpc;
    createFloatingMoney(stats.mpc);
    updateUI();
    save();
}

// ---------------- Upgrade Shop ----------------
function renderUpgradeShop(){
    const div=document.getElementById("upgrade-shop");
    div.innerHTML="";
    const items=[
        {name:"Hand","type":"hands","cost":50},
        {name:"MPC Upgrade","type":"mpc","cost":1000}
    ];
    items.forEach(item=>{
        const btn=document.createElement("button");
        btn.textContent=`${item.name} (${item.cost})`;
        btn.onclick=function(){
            if(stats.money<item.cost)return;
            stats.money-=item.cost;
            stats[item.type]+=item.type==="hands"?1:1;
            item.cost=item.type==="hands"?item.cost*2:item.cost+1000;
            renderUpgradeShop();
            updateUI();
            save();
        };
        div.appendChild(btn);
    });
}

// ---------------- Rarity Shop ----------------
function chooseRarity(){
    const roll=Math.random()*100;
    let sum=0;
    for(const r of rarities){sum+=r.chance;if(roll<=sum)return r.name;}
    return "common";
}

function randomItemName(){ // generate random fun names
    const names=["Crunchy","Salty","Cheesy","Mega","Ultra","Spicy","Golden","Epic","Crazy","Mystery"];
    return names[Math.floor(Math.random()*names.length)]+" "+Math.floor(Math.random()*1000);
}

window.generateShop=function(){
    const shopDiv=document.getElementById("shop");
    shopDiv.innerHTML="";
    for(let i=0;i<5;i++){
        const rarity=chooseRarity();
        const value=Math.floor(Math.random()*50)+50;
        const type=Math.random()<0.5?"mpc":"hands";
        const itemName=randomItemName();
        const div=document.createElement("div");
        div.className="shop-item rarity-"+rarity;
        div.textContent=`${rarity.toUpperCase()} ${itemName} +${value} ${type.toUpperCase()}`;
        div.onclick=function(){
            if(stats.money<value)return alert("Not enough money!");
            stats.money-=value;
            stats[type]+=value;
            updateUI();
            save();
            generateShop(); // refresh after purchase
        };
        shopDiv.appendChild(div);
    }
}

// ---------------- UI ----------------
function updateUI(){
    document.getElementById("money").textContent=stats.money;
}
};
</script>
</body>
</html>
