<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lays Clicker Shop</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('lays-background.png'); /* Replace with your image */
    background-size: cover;
    background-color: #a7d8ff;
  }

  .shop-title {
    text-align: center;
    font-size: 48px;
    font-weight: bold;
    color: #7bff7b;
    margin-top: 20px;
    text-shadow: 2px 2px 0 #000;
  }

  .shop {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    padding: 40px;
  }

  .item {
    background: rgba(30, 30, 30, 0.9);
    border: 4px solid #000;
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
  }

  .item-left {
    display: flex;
    flex-direction: column;
  }

  .item-name {
    font-size: 32px;
    color: white;
    font-weight: bold;
  }

  .rarity {
    font-size: 22px;
    font-weight: bold;
    margin-top: 5px;
  }

  .rarity.common { color: #5cff5c; text-shadow: 1px 1px #000; }
  .rarity.rare { color: #4dc3ff; text-shadow: 1px 1px #000; }
  .rarity.epic { color: #c44dff; text-shadow: 1px 1px #000; }
  .rarity.legendary { color: gold; text-shadow: 1px 1px #000; }

  .price {
    font-size: 24px;
    font-weight: bold;
    color: white;
    margin-top: 10px;
  }

  .buy-btn {
    background: linear-gradient(#4da3ff, #246cff);
    border: none;
    color: white;
    padding: 12px 22px;
    border-radius: 14px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 4px #123c89;
  }

  .bottom-text {
    margin-top: 20px;
    text-align: center;
    font-size: 22px;
    color: white;
    text-shadow: 1px 1px #000;
  }
</style>
</head>
<body>

<div class="shop-title">Shop</div>

<div class="shop">
  <!-- Example item structure (replace with JS later) -->
  <div class="item">
    <div class="item-left">
      <div class="item-name">Mystery Toaster</div>
      <div class="rarity epic">EPIC</div>
      <div class="price">$12,482</div>
    </div>
    <button class="buy-btn">Purchase</button>
  </div>

  <div class="item">
    <div class="item-left">
      <div class="item-name">Turbo Socks</div>
      <div class="rarity common">COMMON</div>
      <div class="price">$3,221</div>
    </div>
    <button class="buy-btn">Purchase</button>
  </div>

  <div class="item">
    <div class="item-left">
      <div class="item-name">Quantum Pencil</div>
      <div class="rarity rare">RARE</div>
      <div class="price">$7,944</div>
    </div>
    <button class="buy-btn">Purchase</button>
  </div>

  <div class="item">
    <div class="item-left">
      <div class="item-name">Plastic Dragon</div>
      <div class="rarity legendary">LEGENDARY</div>
      <div class="price">$54,830</div>
    </div>
    <button class="buy-btn">Purchase</button>
  </div>
</div>

<div class="bottom-text">Shop refreshes every 2:00</div>

</body>
</html>


<script>
// Rarity tiers and their chances
const rarities = [
  { name: 'Common', chance: 60, color: '#4caf50' },
  { name: 'Uncommon', chance: 20, color: '#2ecc71' },
  { name: 'Rare', chance: 10, color: '#3498db' },
  { name: 'Epic', chance: 5, color: '#9b59b6' },
  { name: 'Legendary', chance: 3, color: '#f1c40f' },
  { name: 'Mythic', chance: 1, color: '#e67e22' },
  { name: 'Insane', chance: 0.5, color: '#e74c3c' },
  { name: 'Godly', chance: 0.3, color: '#ff00ff' },
  { name: 'Crazy', chance: 0.2, color: '#00ffff' }
];

function pickRarity() {
  let roll = Math.random() * 100;
  let total = 0;
  for (const r of rarities) {
    total += r.chance;
    if (roll <= total) return r;
  }
  return rarities[0];
}

function randomItemName() {
  const words1 = ['Ultra', 'Mega', 'Hyper', 'Turbo', 'Cyber', 'Shadow', 'Quantum', 'Neon'];
  const words2 = ['Blade', 'Sphere', 'Core', 'Emitter', 'Device', 'Gadget', 'Relic', 'Drive'];
  return words1[Math.floor(Math.random() * words1.length)] + ' ' + words2[Math.floor(Math.random() * words2.length)];
}

function generateShopItems() {
  const container = document.getElementById('shop-items');
  if (!container) return;
  container.innerHTML = '';

  for (let i = 0; i < 2; i++) { // Two pedestals
    const rarity = pickRarity();
    const itemName = randomItemName();
    const price = Math.floor(Math.random() * 50000) + 5000;

    const item = document.createElement('div');
    item.className = 'shop-card';
    item.style.borderColor = rarity.color;
    item.innerHTML = `
      <div class="item-icon">🎁</div>
      <div class="info">
        <h2>${itemName}</h2>
        <p class="rarity" style="color:${rarity.color}">${rarity.name}</p>
        <p class="price">$${price.toLocaleString()}</p>
      </div>
      <button class="buy-btn">Purchase</button>
    `;
    container.appendChild(item);
  }
}

generateShopItems();
</script>
